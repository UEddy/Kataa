[project]
name = "kataa"
version = "0.1.0"
description = "Kataa: training a small model to refuse unjustified financial actions"
requires-python = ">=3.12"
license = { text = "CC-BY-NC-4.0" }

[tool.setuptools.packages.find]
include = ["kataa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
